<nav class="nav" aria-label="Navegación principal">
  @for (link of links; track link.path) {
    <a [routerLink]="link.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">{{ link.label }}</a>
  }
  @if (session.isSupervisor()) {
    <a routerLink="/cierre" routerLinkActive="active">Cierre diario</a>
  }
</nav>
