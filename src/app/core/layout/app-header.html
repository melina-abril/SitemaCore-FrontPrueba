<header class="header">
  <div><a class="app-title" href="/inicio">Sistema Core</a><span class="subtitle">Operación transaccional</span></div>
  <div class="session">
    <span>Usuario: <strong>{{ session.user().name }}</strong></span>
    <label for="role-select">Rol de demostración</label>
    <select id="role-select" [value]="session.user().role" (change)="session.setRole($any($event.target).value)">
      <option value="OPERADOR">Operador</option>
      <option value="SUPERVISOR">Supervisor</option>
    </select>
  </div>
</header>
