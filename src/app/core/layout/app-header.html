<header class="header">
  <div class="header-inner">
    <div>
      <strong class="app-title">Sistema Core</strong>
      <span class="subtitle">Operación transaccional</span>
    </div>
    @let user = session();
    <div class="user" aria-label="Sesión actual">
      <span>{{ user.name }}</span>
      <span class="chip">{{ user.role === 'SUPERVISOR' ? 'Supervisor' : 'Operador' }}</span>
    </div>
  </div>
</header>
