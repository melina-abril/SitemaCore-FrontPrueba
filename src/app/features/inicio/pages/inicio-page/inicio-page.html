<header class="page-heading">
  <h1 class="page-title">Inicio</h1>
  <p>Bienvenido/a, <strong>{{ currentUser.user().name }}</strong> · {{ currentUser.user().role === 'SUPERVISOR' ? 'Supervisor' : 'Operador' }}</p>
</header>

@let s = state();
@switch (s.status) {
  @case ('loading') {
    <app-loading-state />
  }
  @case ('ready') {
    <app-day-summary-card [summary]="s.data" />
  }
  @case ('error') {
    <app-error-alert [message]="s.message" />
    <button class="btn" type="button" (click)="loadSummary()">Reintentar</button>
  }
  @case ('empty') {
    <p class="empty">No hay un resumen disponible para el día.</p>
  }
}

<app-quick-links />
