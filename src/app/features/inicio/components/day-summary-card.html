<section class="card" aria-labelledby="day-summary-title">
  <h2 id="day-summary-title">Resumen del día</h2>
  <div class="summary-grid">
    <div class="stat">
      <span class="stat-label">Fecha operativa</span>
      <strong class="summary-value">{{ summary().fechaOperativa | date:'dd/MM/yyyy':'UTC' }}</strong>
    </div>
    <div class="stat">
      <span class="stat-label">Movimientos cargados</span>
      <strong class="stat-value">{{ summary().cantidadMovimientos }}</strong>
    </div>
    <div class="stat">
      <span class="stat-label">Estado del cierre</span>
      <span class="chip big" [class.completed]="closureClass() === 'completed'" [class.in-progress]="closureClass() === 'in-progress'" [class.pending]="closureClass() === 'pending'">{{ closureLabel() }}</span>
    </div>
  </div>
</section>
