<section aria-labelledby="adjust-title"><header class="page-heading"><div><h1 id="adjust-title" class="page-title">Ajustar movimiento cerrado</h1><p class="muted">Movimiento original N.º {{ originalId }}. El registro original permanece sin modificaciones.</p></div><a class="btn" routerLink="/movimientos">Volver a movimientos</a></header>
@if (error()) { <div class="alert" role="alert">{{ error() }}</div> }
<div class="card"><h2>Nuevo ajuste</h2><p class="muted">Solo supervisores pueden registrar ajustes. Un débito no puede generar saldo negativo.</p><form (ngSubmit)="save()" #adjustmentForm="ngForm"><div class="form-grid"><div class="field"><label for="direction">Dirección del ajuste</label><select id="direction" name="direction" required [(ngModel)]="form.direccion"><option value="CREDITO">Crédito</option><option value="DEBITO">Débito</option></select></div><div class="field"><label for="adjust-amount">Importe</label><input id="adjust-amount" name="amount" type="number" min="0.01" step="0.01" required [(ngModel)]="form.importe" /></div><div class="field grow"><label for="adjust-concept">Concepto</label><input id="adjust-concept" name="concept" maxlength="200" required [(ngModel)]="form.concepto" /></div></div><div class="actions"><button class="btn primary" type="submit" [disabled]="adjustmentForm.invalid || saving()">{{ saving() ? 'Registrando…' : 'Registrar ajuste' }}</button></div></form></div></section>
